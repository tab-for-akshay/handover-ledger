<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handover Ledger · Tab x Akshay</title>
<meta name="description" content="Capture what you know and have decided, and hand the next owner a brief where every line quotes its source. Built by Tab (an AI assistant) for Akshay Wagh, CodersInPune Round 2.">
<style>
  :root { --ink:#1d1d1f; --mute:#6b6b70; --line:#e4e4e8; --bg:#fafaf8; --card:#fff; --acc:#1f5eff; --warn:#b45309; --ok:#15803d; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 -apple-system, system-ui, Segoe UI, Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:18px 20px 10px; max-width:820px; margin:auto; }
  h1 { font-size:22px; margin:0; }
  .sub { color:var(--mute); font-size:14px; margin-top:2px; }
  nav { display:flex; gap:6px; max-width:820px; margin:10px auto 0; padding:0 20px; flex-wrap:wrap; }
  nav button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font-size:14px; cursor:pointer; }
  nav button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  main { max-width:820px; margin:0 auto; padding:8px 20px 40px; }
  h2 { font-size:19px; margin:18px 0 6px; }
  h3 { font-size:15px; margin:22px 0 8px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); }
  .muted { color:var(--mute); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; gap:10px; }
  label { display:grid; gap:4px; font-size:14px; color:var(--mute); }
  input, select, textarea { font:inherit; color:var(--ink); border:1px solid #cfcfd6; border-radius:8px; padding:8px 10px; background:#fff; width:100%; }
  textarea { resize:vertical; }
  button { font:inherit; font-size:14px; border:1px solid #cfcfd6; background:#fff; border-radius:8px; padding:7px 12px; cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row input { flex:1; min-width:160px; }
  .entry { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; margin:8px 0; }
  pre { white-space:pre-wrap; font:13px/1.45 ui-monospace, Menlo, monospace; background:#f4f4f6; padding:8px; border-radius:6px; margin:8px 0; color:#333; }
  .claim { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:8px 0; }
  .claim.rej { opacity:.45; }
  .claim.sup { opacity:.6; border-style:dashed; }
  .claim.gap { border-color:#f2c48d; background:#fffaf2; }
  .stmt { font-weight:600; }
  blockquote { margin:6px 0; padding:4px 10px; border-left:3px solid #d6d6dc; color:#444; font-size:14px; word-break:break-word; }
  .meta { font-size:12.5px; color:var(--mute); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .claim .row { margin-top:8px; }
  .badge { border-radius:999px; padding:1px 8px; background:#eef0f4; color:#333; font-size:12px; }
  .badge.ok { background:#e8f6ec; color:var(--ok); }
  .badge.warn { background:#fdf0e2; color:var(--warn); }
  .badge.old { background:#eee; color:#777; }
  .checks { font-size:14px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .warn-t { color:var(--warn); font-size:13px; margin-top:4px; }
  .hint { font-size:13px; color:var(--mute); margin:0; }
  .log { font-size:13px; color:var(--mute); padding-left:18px; }
  footer { max-width:820px; margin:0 auto; padding:0 20px 40px; color:var(--mute); font-size:13px; }
  code { font-size:13px; background:#f0f0f3; padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>Handover Ledger</h1>
  <div class="sub" id="status">loading…</div>
</header>
<nav>
  <button data-view="capture" class="on">Capture</button>
  <button data-view="brief">Handover brief</button>
  <button data-view="owner">New owner</button>
</nav>
<main id="view"></main>
<footer>
  Built by Tab, an AI assistant, for Akshay Wagh's CodersInPune Round 2 entry (team Tab x Akshay). No human wrote this code and no login is needed.
  Everything you enter stays in this browser. Source: github.com/tab-for-akshay/handover-ledger.
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
